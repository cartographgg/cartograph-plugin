# Cartograph telemetry configuration.
# What leaves this server is determined entirely by this file plus the plugin jar.

# Your per-server API key from cartograph.gg. Empty = telemetry disabled entirely.
api-key: ""
# Where telemetry is sent. Change only for self-hosting.
api-endpoint: "https://api.cartograph.gg"

flags:
  # Report the list of installed plugins (names + versions, never published per-server).
  # On by default; set to false to opt out.
  report-plugins: true
  # Set true on a backend server behind a proxy so it does not double-count sessions
  # the proxy already reports.
  proxy-backend: false

buffer:
  size-threshold: 50
  time-threshold: 60
  # What happens to a batch when a send fails:
  #   disk   - persist to disk, retry with backoff, survives restarts (default)
  #   memory - retry in memory only, bounded, lost on restart
  #   none   - drop it; telemetry is strictly best-effort
  failure-mode: disk
  disk:
    max-size-mb: 8      # on-disk budget; oldest dropped when exceeded
    max-age-hours: 24   # drop batches older than this
  backoff:
    max-seconds: 900              # cap on exponential backoff (15 min)
    retry-after-cap-seconds: 3600 # honor server Retry-After up to 1h

telemetry:
  heartbeat:
    enabled: true
    # Seconds between heartbeats. Clamped to the range [30, 300].
    interval: 60
